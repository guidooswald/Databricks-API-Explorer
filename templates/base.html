<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Databricks API Explorer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <strong>Databricks API Explorer</strong>
            </a>
            <div class="navbar-nav flex-row align-items-center">
                <span class="navbar-text me-3" id="authStatus">
                    <span class="badge bg-secondary">Checking...</span>
                </span>
                <button class="btn btn-outline-info btn-sm me-2" id="checkAuthBtn" onclick="checkAuthStatusManual()" title="Check authentication status">
                    <span id="checkAuthBtnIcon">🔍</span> Check Auth
                </button>
                <button class="btn btn-outline-warning btn-sm me-2" id="reAuthBtn" onclick="reAuthenticate()" style="display: none;">
                    Re-authenticate
                </button>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn" onclick="logout()" style="display: none;">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
